<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Super Platform Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
        }

        #hud {
            position: fixed;
            z-index: 5;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(1100px, 100%);
            padding: 13px 22px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 3px 3px #000;
            font-size: 20px;
        }

        .stat {
            text-align: center;
            min-width: 115px;
        }

        .stat small {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            color: #ffe16b;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            place-items: center;
            color: #fff;
            text-align: center;
        }

        .panel {
            background: #111d;
            border: 4px solid #fff;
            border-radius: 18px;
            padding: 28px 38px;
            box-shadow: 0 12px #0008;
        }

        .panel h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .panel p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            border: 0;
            border-radius: 12px;
            background: #ffd83d;
            padding: 13px 28px;
            font-size: 18px;
            font-weight: 900;
            margin-top: 17px;
            box-shadow: 0 5px #a66f00;
            cursor: pointer;
        }

        #mobile {
            position: fixed;
            z-index: 8;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 max(14px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-right));
            pointer-events: none;
            padding-bottom: max(15px, env(safe-area-inset-bottom));
        }

        .grp {
            display: flex;
            gap: clamp(8px, 2vw, 14px);
            pointer-events: auto;
            align-items: center;
        }

        .key {
            width: clamp(62px, 17vw, 82px);
            height: clamp(62px, 17vw, 82px);
            border: 3px solid #fffd;
            border-radius: 50%;
            background: #0009;
            color: #fff;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: grid;
            place-items: center;
            font-size: clamp(24px, 7vw, 34px);
            font-weight: 900;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: transform .08s ease, background .08s ease;
        }

        @media (min-width: 800px) {
            #mobile {
                display: none;
            }
        }

        @media (max-width: 500px) {
            #hud {
                padding: 8px 4px;
                font-size: 14px;
            }

            .stat {
                min-width: 72px;
            }

            .stat small {
                font-size: 8px;
            }

            .panel {
                width: 90%;
                padding: 22px;
            }

            .panel h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <div id="hud">
        <div class="stat"><small>WORLD</small>1-1</div>
        <div class="stat"><small>COINS</small>🪙 <b id="coin">00</b></div>
        <div class="stat"><small>SCORE</small><b id="score">000000</b></div>
        <div class="stat"><small>LIVES</small>♥ <b id="lives">3</b></div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1 id="title">GAME OVER</h1>
            <p id="text"></p>
            <button id="again">PLAY AGAIN</button>
        </div>
    </div>

    <div id="mobile">
        <div class="grp">
            <div class="key" data-k="ArrowLeft">◀</div>
            <div class="key" data-k="ArrowRight">▶</div>
        </div>
        <div class="grp">
            <div class="key" data-k="Space">●</div>
        </div>
    </div>

    <script>
        // Config & Variables
        const C = document.getElementById("c");
        const x = C.getContext("2d");
        const VW = 960, VH = 540, WW = 7200;

        let cam = 0, score = 0, coins = 0, lives = 3;
        let state = "play", last = 0, keys = {}, jumpLock = false;
        let player, solids, bricks, items, enemies, particles, pipes, flag, clouds, hills, decor;

        const scoreEl = document.getElementById("score");
        const coin = document.getElementById("coin");

        // Screen setup & Resize handling
        function resize() {
            const d = Math.min(devicePixelRatio || 1, 2);
            C.width = innerWidth * d;
            C.height = innerHeight * d;
            const s = Math.min(innerWidth / VW, innerHeight / VH);
            x.setTransform(d * s, 0, 0, d * s, ((innerWidth - VW * s) * d) / 2, ((innerHeight - VH * s) * d) / 2);
            x.imageSmoothingEnabled = false;
        }

        addEventListener("resize", resize);
        resize();

        // Controls
        addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
            if (e.code === "KeyR" && state !== "play") reset();
        });

        addEventListener("keyup", (e) => (keys[e.code] = false));

        // Mobile / touch controls
        document.querySelectorAll(".key").forEach((b) => {
            const press = (e) => {
                e.preventDefault();
                if (b.setPointerCapture && e.pointerId != null) {
                    try { b.setPointerCapture(e.pointerId); } catch (_) {}
                }
                keys[b.dataset.k] = true;
                b.style.transform = "scale(.92)";
                b.style.background = "#ffffff44";
            };
            const release = (e) => {
                e.preventDefault();
                keys[b.dataset.k] = false;
                b.style.transform = "scale(1)";
                b.style.background = "#0009";
            };
            b.addEventListener("pointerdown", press, { passive: false });
            b.addEventListener("pointerup", release, { passive: false });
            b.addEventListener("pointercancel", release, { passive: false });
            b.addEventListener("lostpointercapture", release, { passive: false });
        });

        // Never leave a movement key stuck if the finger is lifted outside the game.
        addEventListener("blur", () => {
            Object.keys(keys).forEach(k => keys[k] = false);
            document.querySelectorAll(".key").forEach(b => {
                b.style.transform = "scale(1)";
                b.style.background = "#0009";
            });
        });
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                Object.keys(keys).forEach(k => keys[k] = false);
            }
        });

        document.getElementById("again").onclick = reset;

        // Helper Functions
        function R(a, b, c, d) { return { x: a, y: b, w: c, h: d }; }
        function B(a, b, t) { return { x: a, y: b, w: 50, h: 22, t, hit: false, item: null }; }
        function E(a) { return { x: a, y: 455, w: 32, h: 30, vx: -1.2, dead: false }; }
        function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
        function addText(px, py, t) { particles.push({ x: px, y: py, t, life: 50, vy: -1.2 }); }

        function updateHUD() {
            coin.textContent = String(coins).padStart(2, "0");
            scoreEl.textContent = String(score).padStart(6, "0");
            document.getElementById("lives").textContent = lives;
        }

        // Reset Game
        function reset() {
            score = 0; coins = 0; lives = 3; state = "play"; cam = 0; particles = [];
            player = { x: 110, y: 380, w: 30, h: 44, vx: 0, vy: 0, ground: false, face: 1, inv: 0, anim: 0, big: false };

            solids = [
                R(0,485,1150,55),R(1240,485,920,55),R(2260,485,1250,55),R(3570,485,1080,55),R(4690,485,2510,55),
                R(350,405,190,22),R(440,355,170,22),R(690,330,160,22),R(940,395,150,22),
                R(1280,390,180,22),R(1510,325,170,22),R(1760,390,170,22),R(2010,335,110,22),
                R(2400,390,180,22),R(2680,325,150,22),R(2940,390,200,22),R(3230,335,140,22),
                R(3690,385,170,22),R(3960,315,160,22),R(4230,375,170,22),R(4490,305,140,22),
                R(4880,390,180,22),R(5160,325,160,22),R(5440,380,180,22),R(5760,320,160,22),
                R(6100,380,170,22),R(6470,335,170,22)
            ];

            bricks = [
                B(590, 390, "?"), B(640, 390, "brick"), B(690, 390, "?"),
                B(1300, 305, "?"), B(1350, 305, "brick"), B(1400, 305, "?"),
                B(1810, 320, "?"), B(1860, 320, "brick"), B(1910, 320, "?"),
                B(2480, 315, "?"), B(2530, 315, "?"), B(2580, 315, "brick"),
                B(3050, 315, "?"), B(3100, 315, "brick"), B(3150, 315, "?"),
                B(4020, 245, "?"), B(4070, 245, "brick"), B(4120, 245, "?"),
                B(5220, 270, "?"), B(5270, 270, "brick"), B(5320, 270, "?")
            ];

            items = [];
            [
                [470, 350], [750, 290], [1020, 360], [1325, 345], [1375, 345], [1425, 345],
                [1570, 275], [1825, 290], [1875, 290], [1925, 290], [2100, 290], [2485, 355],
                [2540, 275], [2760, 280], [3040, 355], [3090, 355], [3140, 355], [3300, 290],
                [3750, 340], [4025, 205], [4075, 205], [4125, 205], [4300, 330], [4550, 255],
                [4935, 335], [5250, 275], [5300, 275], [5350, 275], [5520, 330], [5835, 270],
                [6170, 330], [6550, 285]
            ].forEach((p, i) => items.push({ x: p[0], y: p[1], r: 10, t: "coin", got: false, n: i }));

            // Powerups in selected question blocks
            bricks[0].item = "mushroom";
            bricks[3].item = "mushroom";
            bricks[8].item = "flower";
            bricks[15].item = "mushroom";

            enemies = [
                E(840), E(1460), E(1960), E(2380), E(2820), E(3340), E(3820), E(4350), E(5000), E(5580), E(6250), E(6800)
            ];

            pipes = [
                { x: 1080, y: 425, w: 70, h: 60 },
                { x: 2160, y: 405, w: 80, h: 80 },
                { x: 3450, y: 395, w: 85, h: 90 },
                { x: 4650, y: 425, w: 70, h: 60 },
                { x: 6400, y: 405, w: 80, h: 80 }
            ];

            flag = { x: 6950, y: 180 };

            clouds = [
                [150, 100, 1], [530, 145, 0.8], [950, 85, 1.2], [1500, 105, 0.9],
                [2050, 80, 1.1], [2700, 120, 0.8], [3400, 80, 1.2], [4100, 110, 0.9],
                [4800, 75, 1.1], [5500, 125, 0.8], [6300, 80, 1.2], [6900, 120, 0.9]
            ];

            hills = [
                [0, 445, 300, 210], [600, 440, 330, 190], [1300, 440, 350, 205],
                [2050, 440, 330, 195], [2750, 440, 360, 205], [3500, 440, 340, 190],
                [4250, 440, 360, 205], [5000, 440, 330, 190], [5750, 440, 360, 205],
                [6500, 440, 350, 195]
            ];

            // Decorative map objects: visual only, no collision.
            decor = [];
            for (let i=0;i<36;i++) decor.push({type:i%3===0?'tree':i%3===1?'bush':'rock',x:150+i*205+(i%4)*22,y:i%3===0?394:458,s:.75+(i%5)*.08});
            decor.push({type:'sign',x:780,y:444,text:'GO!'}, {type:'sign',x:2860,y:444,text:'DANGER'}, {type:'sign',x:5350,y:444,text:'RUN!'});

            updateHUD();
        }

        // Mechanics
        function jump() {
            if (player.ground) {
                player.vy = player.big ? -13.8 : -12.7;
                player.ground = false;
            }
        }

        function hurt() {
            if (player.inv > 0) return;
            lives--;
            updateHUD();
            if (lives <= 0) {
                state = "over";
                overlay("GAME OVER", "The adventure is over.");
                return;
            }
            player.x = Math.max(50, player.x - 120);
            player.y = 250;
            player.vy = -7;
            player.inv = 130;
        }

        function blockHit(b) {
            b.hit = true;
            score += 50;
            if (b.item) {
                items.push({ x: b.x + 25, y: b.y - 8, r: 13, t: b.item, got: false, n: 0, vy: -1.5 });
                addText(b.x + 25, b.y - 10, b.item === "mushroom" ? "+POWER" : "FLOWER");
            } else {
                coins++;
                score += 100;
                addText(b.x + 25, b.y - 10, "+100");
            }
            updateHUD();
        }

        function overlay(a, b) {
            title.textContent = a;
            text.textContent = b;
            document.getElementById("overlay").style.display = "grid";
        }

        // Game Update
        function update() {
            if (state !== "play") return;

            const L = keys.ArrowLeft || keys.KeyA;
            const Rt = keys.ArrowRight || keys.KeyD;
            const J = keys.Space || keys.ArrowUp || keys.KeyW;

            if (J && !jumpLock) jump();
            jumpLock = !!J;

            let target = (Rt ? 1 : 0) - (L ? 1 : 0);
            player.vx += (target * 5 - player.vx) * 0.18;
            if (!target) player.vx *= 0.84;
            if (Math.abs(player.vx) > 0.2) player.face = Math.sign(player.vx);

            player.vy += 0.62;
            if (player.vy > 15) player.vy = 15;

            const oldY = player.y;
            player.x += player.vx;
            player.x = Math.max(0, Math.min(WW - player.w, player.x));
            player.y += player.vy;
            player.ground = false;

            const all = solids.concat(bricks.map((b) => R(b.x, b.y, b.w, b.h))).concat(pipes);

            for (const q of all) {
                if (hit(player, q)) {
                    if (oldY + player.h <= q.y + 8 && player.vy >= 0) {
                        player.y = q.y - player.h;
                        player.vy = 0;
                        player.ground = true;
                    } else if (oldY >= q.y + q.h - 7 && player.vy < 0) {
                        player.y = q.y + q.h;
                        player.vy = 0;
                        const b = bricks.find((z) => z.x === q.x && z.y === q.y);
                        if (b && !b.hit) blockHit(b);
                    } else if (player.x + player.w / 2 < q.x + q.w / 2) {
                        player.x = q.x - player.w;
                        player.vx = 0;
                    } else {
                        player.x = q.x + q.w;
                        player.vx = 0;
                    }
                }
            }

            for (const it of items) {
                if (!it.got && hit(player, R(it.x - 10, it.y - 10, 20, 20))) {
                    it.got = true;
                    coins++;
                    score += 100;
                    addText(it.x, it.y, "+100");
                    updateHUD();
                }
            }

            for (const e of enemies) {
                if (e.dead) continue;
                e.x += e.vx;
                const floor = solids.find((q) => e.x + e.w > q.x && e.x < q.x + q.w && Math.abs(e.y + e.h - q.y) < 10);
                if (!floor || e.x < floor.x || e.x + e.w > floor.x + floor.w) e.vx *= -1;

                if (hit(player, e)) {
                    if (player.vy > 1 && player.y + player.h - e.y < 17) {
                        e.dead = true;
                        player.vy = -8;
                        score += 200;
                        addText(e.x, e.y, "+200");
                        updateHUD();
                    } else {
                        hurt();
                    }
                }
            }

            if (player.inv > 0) player.inv--;
            if (player.y > 650) hurt();

            if (player.x + player.w > flag.x) {
                score += 5000;
                updateHUD();
                state = "win";
                overlay("LEVEL COMPLETE", "You reached the flag! Score: " + score);
            }

            cam = Math.max(0, Math.min(WW - VW, player.x - 350));
            particles.forEach((p) => {
                p.y += p.vy;
                p.life--;
                p.vy -= 0.02;
            });
            particles = particles.filter((p) => p.life > 0);
            player.anim++;
        }

        // Render / Drawing Functions
        function draw() {
            x.clearRect(0, 0, VW, VH);

            // Sky Background
            const g = x.createLinearGradient(0, 0, 0, VH);
            g.addColorStop(0, "#48bfff");
            g.addColorStop(1, "#bfefff");
            x.fillStyle = g;
            x.fillRect(0, 0, VW, VH);

            x.save();
            x.translate(-cam, 0);

            // Sun
            x.fillStyle = "#fff0a0";
            x.beginPath();
            x.arc(cam + 790, 95, 48, 0, 7);
            x.fill();

            // Clouds
            for (const c of clouds) {
                let s = c[2];
                x.fillStyle = "#fff";
                x.beginPath();
                x.arc(c[0], c[1], 25 * s, Math.PI, 0);
                x.arc(c[0] + 30 * s, c[1] - 14 * s, 31 * s, Math.PI, 0);
                x.arc(c[0] + 63 * s, c[1], 23 * s, Math.PI, 0);
                x.fillRect(c[0] - 2 * s, c[1], 65 * s, 24 * s);
                x.fill();
            }

            // Hills
            for (const h of hills) {
                x.fillStyle = "#55ae42";
                x.beginPath();
                x.moveTo(h[0], 485);
                x.quadraticCurveTo(h[0] + h[2] / 2, h[1] - h[3], h[0] + h[2], 485);
                x.closePath();
                x.fill();
                x.fillStyle = "#75c85a";
                x.beginPath();
                x.moveTo(h[0] + h[2] * 0.2, 485);
                x.quadraticCurveTo(h[0] + h[2] / 2, h[1] - h[3] * 0.65, h[0] + h[2] * 0.82, 485);
                x.closePath();
                x.fill();
            }

            // Rich environment layers
            drawMountains();
            drawZoneAtmosphere();
            for (const d of decor) drawDecor(d);

            // Map elements
            for (const p of solids) ground(p);
            for (const p of pipes) pipe(p);
            for (const b of bricks) block(b);
            for (const it of items) {
                if (!it.got) {
                    if (it.t === "coin") drawCoin(it.x, it.y + Math.sin(performance.now() / 140 + it.n) * 3);
                    else drawPower(it);
                }
            }
            for (const e of enemies) if (!e.dead) goomba(e);

            flagDraw();
            mario(player);

            // Floating Particles Text
            x.font = "bold 16px Arial";
            x.textAlign = "center";
            for (const p of particles) {
                x.globalAlpha = p.life / 50;
                x.fillStyle = "#fff";
                x.strokeStyle = "#000";
                x.lineWidth = 3;
                x.strokeText(p.t, p.x, p.y);
                x.fillText(p.t, p.x, p.y);
            }
            x.globalAlpha = 1;
            x.restore();
        }

        function drawMountains(){
            x.save(); x.globalAlpha=.28;
            for(let i=-1;i<12;i++){
                let bx=i*760-cam*.18;
                x.fillStyle='#587f7d'; x.beginPath(); x.moveTo(bx,485); x.lineTo(bx+190,315); x.lineTo(bx+390,485); x.closePath(); x.fill();
                x.fillStyle='#b5d7c2'; x.beginPath(); x.moveTo(bx+150,350); x.lineTo(bx+190,315); x.lineTo(bx+235,350); x.lineTo(bx+205,338); x.lineTo(bx+190,356); x.lineTo(bx+170,338); x.closePath(); x.fill();
            }
            x.restore();
        }
        function drawZoneAtmosphere(){
            let zone=player.x<1800?'GRASS':player.x<3500?'FOREST':player.x<4700?'CAVE':'CASTLE';
            if(zone==='FOREST'){
                x.fillStyle='rgba(20,90,40,.10)'; x.fillRect(cam,0,VW,VH);
                for(let i=0;i<8;i++){let px=cam+((i*137)%VW),py=120+(i%4)*55;x.fillStyle='rgba(255,255,210,.12)';x.fillRect(px,py,3,70);}
            }else if(zone==='CAVE'){
                x.fillStyle='rgba(45,25,65,.18)';x.fillRect(cam,0,VW,VH);
                for(let i=0;i<10;i++){let px=cam+((i*113)%VW),py=100+(i%5)*55;x.fillStyle='rgba(170,220,255,.16)';x.beginPath();x.arc(px,py,2,0,7);x.fill();}
            }else if(zone==='CASTLE'){
                x.fillStyle='rgba(90,50,90,.12)';x.fillRect(cam,0,VW,VH);
            }
        }
        function drawDecor(d){
            let s=d.s||1;
            if(d.type==='tree'){
                x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(d.x,d.y+47,28*s,6*s,0,0,7);x.fill();
                x.fillStyle='#704020';x.fillRect(d.x-7*s,d.y-2*s,14*s,48*s);x.fillStyle='#a35d2b';x.fillRect(d.x-3*s,d.y,4*s,43*s);
                [[-18,-17,17],[0,-30,22],[20,-16,18],[0,-7,24]].forEach(q=>{x.fillStyle='#176a30';x.beginPath();x.arc(d.x+q[0]*s,d.y+q[1]*s,q[2]*s,0,7);x.fill();});
                x.fillStyle='#35ad48';x.beginPath();x.arc(d.x-5*s,d.y-25*s,15*s,0,7);x.fill();
            }else if(d.type==='bush'){
                x.fillStyle='#12642d';x.beginPath();x.arc(d.x-14*s,d.y,15*s,Math.PI,0);x.arc(d.x,d.y-8*s,20*s,Math.PI,0);x.arc(d.x+16*s,d.y,14*s,Math.PI,0);x.fill();
                x.fillStyle='#39ad48';x.beginPath();x.arc(d.x-7*s,d.y-7*s,11*s,0,7);x.arc(d.x+10*s,d.y-5*s,10*s,0,7);x.fill();
            }else if(d.type==='rock'){
                x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(d.x,d.y+5*s,24*s,6*s,0,0,7);x.fill();
                x.fillStyle='#687078';x.beginPath();x.moveTo(d.x-23*s,d.y+5*s);x.lineTo(d.x-12*s,d.y-11*s);x.lineTo(d.x+4*s,d.y-17*s);x.lineTo(d.x+20*s,d.y-5*s);x.lineTo(d.x+24*s,d.y+5*s);x.closePath();x.fill();
                x.fillStyle='#a0a6a7';x.beginPath();x.moveTo(d.x-11*s,d.y-9*s);x.lineTo(d.x+3*s,d.y-13*s);x.lineTo(d.x+10*s,d.y-6*s);x.lineTo(d.x-4*s,d.y-3*s);x.closePath();x.fill();
            }else if(d.type==='sign'){
                x.fillStyle='#693b20';x.fillRect(d.x-3,d.y-3,6,30);x.fillStyle='#c98e48';x.fillRect(d.x-31,d.y-29,62,29);x.strokeStyle='#63371c';x.lineWidth=3;x.strokeRect(d.x-31,d.y-29,62,29);x.fillStyle='#4b2a19';x.font='900 10px Arial';x.textAlign='center';x.fillText(d.text,d.x,d.y-10);
            }
        }
        function ground(p){
            let g=x.createLinearGradient(0,p.y,0,p.y+p.h);g.addColorStop(0,'#a96532');g.addColorStop(.5,'#844a28');g.addColorStop(1,'#5b301f');x.fillStyle=g;x.fillRect(p.x,p.y,p.w,p.h);
            x.fillStyle='#268d38';x.fillRect(p.x,p.y,p.w,13);x.fillStyle='#63d052';x.fillRect(p.x,p.y,p.w,4);
            x.fillStyle='#3dad42';for(let i=p.x+5;i<p.x+p.w;i+=18){x.fillRect(i,p.y-3,4,5);if(Math.floor(i/18)%2===0)x.fillRect(i+4,p.y-1,3,3);}
            for(let i=Math.ceil(p.x/28)*28;i<p.x+p.w;i+=28){x.fillStyle='#6b3823';x.fillRect(i+4,p.y+25+(Math.floor(i/28)%2)*4,17,6);x.fillStyle='#b86c38';x.fillRect(i+7,p.y+27+(Math.floor(i/28)%2)*4,6,2);x.fillStyle='#542d20';x.fillRect(i+18,p.y+41,7,5);}
            x.fillStyle='#3c231b';x.fillRect(p.x,p.y+p.h-5,p.w,5);
        }
        function pipe(p){
            x.fillStyle='rgba(0,0,0,.25)';x.fillRect(p.x+5,p.y+p.h-1,p.w+4,7);
            let g=x.createLinearGradient(p.x,0,p.x+p.w,0);g.addColorStop(0,'#08752b');g.addColorStop(.25,'#25bd49');g.addColorStop(.55,'#65df6d');g.addColorStop(.8,'#20a63d');g.addColorStop(1,'#075b24');x.fillStyle=g;x.fillRect(p.x+9,p.y+13,p.w-18,p.h);
            x.fillStyle='#0a6d29';x.fillRect(p.x-2,p.y+2,p.w+4,17);x.fillStyle='#39ca59';x.fillRect(p.x+3,p.y,p.w-6,14);x.fillStyle='#7aee80';x.fillRect(p.x+8,p.y+3,Math.max(8,p.w*.35),4);x.fillStyle='#082719';x.fillRect(p.x+10,p.y+8,p.w-20,5);x.strokeStyle='#075b25';x.lineWidth=3;x.strokeRect(p.x+9,p.y+13,p.w-18,p.h-13);
        }
        function block(b){
            let c=b.hit?'#805739':b.t==='brick'?'#b95628':'#efb52d';let g=x.createLinearGradient(0,b.y,0,b.y+b.h);g.addColorStop(0,b.hit?'#9b6d46':b.t==='brick'?'#dc7035':'#ffd34b');g.addColorStop(1,c);x.fillStyle=g;x.fillRect(b.x,b.y,b.w,b.h);
            x.fillStyle='rgba(255,255,255,.25)';x.fillRect(b.x+2,b.y+2,b.w-4,3);x.fillStyle='rgba(0,0,0,.2)';x.fillRect(b.x+2,b.y+b.h-4,b.w-4,3);x.strokeStyle='#713619';x.lineWidth=2;x.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);
            if(b.t==='?'&&!b.hit){x.fillStyle='#fff3a6';x.font='900 18px Arial';x.textAlign='center';x.fillText('?',b.x+25,b.y+18);}else{x.strokeStyle='#743718';x.beginPath();x.moveTo(b.x+17,b.y);x.lineTo(b.x+17,b.y+b.h);x.moveTo(b.x+34,b.y);x.lineTo(b.x+34,b.y+b.h);x.moveTo(b.x,b.y+11);x.lineTo(b.x+b.w,b.y+11);x.stroke();}
        }

        function drawCoin(a, b) {
            x.fillStyle = "#e5a400"; x.beginPath(); x.ellipse(a, b, 10, 14, 0, 0, 7); x.fill();
            x.strokeStyle = "#8e6200"; x.lineWidth = 2; x.stroke();
            x.fillStyle = "#fff27a"; x.beginPath(); x.ellipse(a - 2, b, 3, 10, 0, 0, 7); x.fill();
        }

        function drawPower(i) {
            let y = i.y;
            if (i.t === "mushroom") {
                x.fillStyle = "#e53a32"; x.beginPath(); x.arc(i.x, y, 13, Math.PI, 0); x.fill();
                x.fillStyle = "#fff"; x.beginPath(); x.arc(i.x - 6, y - 6, 4, 0, 7); x.arc(i.x + 5, y - 7, 4, 0, 7); x.fill();
                x.fillStyle = "#f0a06d"; x.fillRect(i.x - 8, y, 16, 11);
            } else {
                x.fillStyle = "#ff6b36"; x.beginPath(); x.arc(i.x, y, 10, 0, 7); x.fill();
                x.fillStyle = "#ffd447"; x.fillRect(i.x - 3, y - 14, 6, 14);
            }
        }

        function goomba(e) {
            x.fillStyle = "rgba(0,0,0,.2)"; x.beginPath(); x.ellipse(e.x + 16, e.y + 31, 19, 5, 0, 0, 7); x.fill();
            x.fillStyle = "#a84c21"; x.beginPath(); x.arc(e.x + 16, e.y + 15, 16, Math.PI, 0); x.lineTo(e.x + 32, e.y + 25);
            x.quadraticCurveTo(e.x + 16, e.y + 37, e.x, e.y + 25); x.fill();
            x.fillStyle = "#fff"; x.fillRect(e.x + 6, e.y + 11, 8, 10); x.fillRect(e.x + 19, e.y + 11, 8, 10);
            x.fillStyle = "#111"; x.fillRect(e.x + 10, e.y + 15, 4, 6); x.fillRect(e.x + 19, e.y + 15, 4, 6);
            x.fillStyle = "#552619"; x.fillRect(e.x + 1, e.y + 27, 13, 5); x.fillRect(e.x + 18, e.y + 27, 13, 5);
        }

        function mario(p) {
            if (p.inv && Math.floor(p.inv / 5) % 2 === 0) return;
            let a = p.x, b = p.y;
            x.fillStyle = "rgba(0,0,0,.18)"; x.beginPath(); x.ellipse(a + 15, b + 44, 18, 4, 0, 0, 7); x.fill();
            x.fillStyle = "#2449a5"; x.fillRect(a + 5, b + 27, 9, 13); x.fillRect(a + 17, b + 27, 9, 13);
            x.fillStyle = "#5b2a1c"; x.fillRect(a + 2, b + 38, 13, 6); x.fillRect(a + 18, b + 38, 13, 6);
            x.fillStyle = "#e63132"; x.fillRect(a + 5, b + 14, 22, 18);
            x.fillStyle = "#f3a06b"; x.fillRect(a + 1, b + 18, 6, 13); x.fillRect(a + 25, b + 18, 6, 13); x.fillRect(a + 7, b + 5, 19, 16);
            x.fillStyle = "#4b2519"; x.fillRect(a + 7, b + 4, 19, 7);
            x.fillStyle = "#e63132"; x.fillRect(a + 4, b + 1, 23, 8); x.fillRect(a, b + 6, 29, 6);
            x.fillStyle = "#fff"; x.font = "bold 7px Arial"; x.textAlign = "center"; x.fillText("M", a + 16, b + 8);
            x.fillStyle = "#222"; x.fillRect(a + 20, b + 12, 3, 3);
            x.fillStyle = "#ffd33b"; x.fillRect(a + 11, b + 18, 3, 3); x.fillRect(a + 18, b + 18, 3, 3);
        }

        function flagDraw() {
            let a = flag.x;
            x.fillStyle = "#ddd"; x.fillRect(a, 180, 5, 305);
            x.fillStyle = "#e63232"; x.beginPath(); x.moveTo(a + 5, 195); x.lineTo(a + 70, 215); x.lineTo(a + 5, 238); x.closePath(); x.fill();
            x.fillStyle = "#ffd33b"; x.beginPath(); x.arc(a + 2, 180, 9, 0, 7); x.fill();
            x.fillStyle = "#55a33b"; x.fillRect(a - 24, 480, 55, 7);
        }

        // Main Loop
        function loop(t) {
            if (!last) last = t;
            update();
            draw();
            last = t;
            requestAnimationFrame(loop);
        }

        reset();
        requestAnimationFrame(loop);
    </script>

      @media (max-width:520px) and (orientation:portrait){#rotateHint{display:grid}}
      @media (max-height:430px) and (orientation:landscape){#mobile{bottom:6px}.key{opacity:.88}}
