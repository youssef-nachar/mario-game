*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070d;font-family:Arial,sans-serif;user-select:none;touch-action:none}
canvas{display:block;width:100vw;height:100vh;image-rendering:auto}

.stat{text-align:center;min-width:105px}.stat small{display:block;font-size:10px;letter-spacing:2px;color:#ffe56a;margin-bottom:2px}
#levelName{color:#9df3ff}
#overlay{position:fixed;inset:0;z-index:20;background:rgba(3,7,16,.78);display:none;place-items:center;color:#fff;text-align:center;backdrop-filter:blur(7px)}
.panel{width:min(620px,92%);background:linear-gradient(145deg,#14233b,#09111f);border:3px solid #dffaff;border-radius:22px;padding:30px 34px;box-shadow:0 18px 60px #000b,0 0 35px #55dfff33}
.panel h1{font-size:42px;margin-bottom:10px;letter-spacing:1px}.panel p{font-size:18px;line-height:1.6;color:#dce8f2}
button{border:0;border-radius:13px;background:linear-gradient(#ffe86a,#ffb91e);padding:13px 28px;font-size:18px;font-weight:900;margin:17px 7px 0;box-shadow:0 5px #8c5600;cursor:pointer}
#mobile{position:fixed;z-index:8;bottom:15px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 16px max(15px,env(safe-area-inset-bottom));pointer-events:none}
.grp{display:flex;gap:12px;pointer-events:auto;align-items:center}
.key{width:clamp(60px,16vw,82px);height:clamp(60px,16vw,82px);border:2px solid #fff9;border-radius:50%;background:#06101dcc;color:#fff;display:grid;place-items:center;font-size:31px;font-weight:900;box-shadow:0 8px 25px #0008,inset 0 0 20px #7ceaff18;touch-action:none}
@media(min-width:800px){#mobile{display:none}}
#bossbar{position:fixed;z-index:7;left:50%;top:65px;transform:translateX(-50%);width:min(520px,70%);display:none}
#bossbar .label{text-align:center;color:#fff;font-weight:900;text-shadow:2px 2px #000;margin-bottom:4px}
#bar{height:15px;border:2px solid #fff;border-radius:20px;background:#250b12;overflow:hidden;box-shadow:0 3px 10px #000}
#bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2638,#ff9d2e)}
#rotateHint{display:none;position:fixed;z-index:30;inset:0;background:#07101dee;color:#fff;place-items:center;text-align:center;padding:30px;font-size:20px;font-weight:900;line-height:1.6}
@media(max-width:520px) and (orientation:portrait){#rotateHint{display:grid}}

/* ===== TRUE FULLSCREEN GAME ===== */

<script>
const C=document.getElementById("game"),ctx=C.getContext("2d");

/* ===== EDGE-TO-EDGE CANVAS SCALING ===== */
function fitGameToScreen(){
  const c = document.getElementById('game');
  if(!c) return;
  c.style.width = '100vw';
  c.style.height = '100dvh';
  c.width = VW;
  c.height = VH;
  document.documentElement.style.width = '100%';
  document.documentElement.style.height = '100%';
  document.body.style.width = '100%';
  document.body.style.height = '100%';
}
window.addEventListener('resize', fitGameToScreen, {passive:true});
window.addEventListener('orientationchange', ()=>setTimeout(fitGameToScreen,100), {passive:true});
document.addEventListener('fullscreenchange', fitGameToScreen);
let scale=1,cam=0,level=1,score=0,coins=0,lives=3,state="play",keys={},jumpLock=false;
let player,solids,blocks,items,enemies,particles,decor,pipes,goal,boss,levelW;

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 C.width=innerWidth*d;C.height=innerHeight*d;
 scale=Math.min(innerWidth/VW,innerHeight/VH);
 ctx.setTransform(d*scale,0,0,d*scale,(innerWidth-VW*scale)*d/2,(innerHeight-VH*scale)*d/2);
 ctx.imageSmoothingEnabled=true;
}
addEventListener("resize",resize);resize();

addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["Space","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault();
 if(e.code==="KeyR" && state!=="play")restartLevel();
 if(e.code==="Escape" && state==="play")pause();
});
addEventListener("keyup",e=>keys[e.code]=false);
document.querySelectorAll(".key").forEach(b=>{
 const down=e=>{e.preventDefault();keys[b.dataset.k]=true;b.style.transform="scale(.9)"};
 const up=e=>{e.preventDefault();keys[b.dataset.k]=false;b.style.transform="scale(1)"};
 b.addEventListener("pointerdown",down,{passive:false});
 b.addEventListener("pointerup",up,{passive:false});
 b.addEventListener("pointercancel",up,{passive:false});
 b.addEventListener("lostpointercapture",up,{passive:false});
});
addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));
$("next").onclick=nextLevel;
$("again").onclick=()=>{level=1;score=0;coins=0;lives=3;loadLevel()};

function $(id){return document.getElementById(id)}
const R=(x,y,w,h)=>({x,y,w,h});
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function addText(x,y,t,color="#fff"){particles.push({x,y,t,color,life:55,vy:-1.2})}
function block(x,y,type="?"){return{x,y,w:50,h:26,type,used:false,item:null}}
function enemy(x,y,type="walker"){
 return{x,y,w:type==="flyer"?38:34,h:type==="flyer"?28:31,vx:type==="flyer"?1.3:-1.15,vy:0,type,dead:false,phase:Math.random()*6}
}

function updateHUD(){
 $("world").textContent=`${level}-${level===10?"BOSS":1}`;
 $("coins").textContent=String(coins).padStart(2,"0");
 $("score").textContent=String(score).padStart(6,"0");
 $("lives").textContent=lives;
 $("power").textContent=player?.flower?"FIRE":(player?.big?"SUPER":"SMALL");
 $("bossbar").style.display=(level===10&&boss&&!boss.dead)?"block":"none";
 if(boss)$("bar").style.width=Math.max(0,boss.hp/boss.maxHp*100)+"%";
}

   [560,970,1390,1980,2520,3140,3700,4260,4800,5350,5910],
   [500,830,1160,1510,1940,2340,2770,3200,3650,4080,4510,4950,5400,5850],
   [700,1280,1840,2410,2940,3500,4050,4590,5140]
 ];
 for(let i=0;i<enemyPatterns[n-1].length;i++){
   const ex=enemyPatterns[n-1][i];
   if(ex>maxX-650)continue;
   const flyer=(n>=3 && ((i+n)%5===0));
   let ey=454;
   // Put selected enemies on nearby platforms.
   if(i%3===1){
     const candidates=s.filter(q=>q.h===20&&q.x<ex+160&&q.x+q.w>ex-160);
     if(candidates.length){
       const q=candidates[candidates.length-1];
       ey=q.y-31;
     }
   }
   en.push(enemy(ex,ey,flyer?"flyer":"walker"));
 }

 // Distinct decorative theme per level.
 const decoTypes=[
   ["tree","bush","rock"],["rock","bush","lamp"],["tree","tree","rock"],
   ["rock","rock","lamp"],["rock","lamp","bush"],["cloud","cloud","lamp"],
   ["lamp","rock","tree"],["tree","bush","rock"],["lamp","rock","rock"],
   ["rock","lamp","rock"]
 ];
 for(let i=0;i<Math.ceil(maxX/180);i++){
   de.push({
     x:i*180+70+(i%3)*25,
     y:405,
     type:decoTypes[n-1][i%decoTypes[n-1].length],
     s:.8+(i%4)*.08
   });
 }

 levelW=maxX+180;
 goal={x:levelW-150,y:175};

 if(n===10){
   // Final 850px are the dragon arena.
   s.push(R(levelW-900,groundY,900,55));
   boss={x:levelW-570,y:330,w:130,h:120,vx:1.2,vy:0,hp:12,maxHp:12,dead:false,fire:90};
 }

 return {s,b,it,en,de,pipes};
}

/* ===== SAFE QUESTION-BLOCK SPACING =====
   Keep yellow/question blocks high enough that Mario can walk underneath
   and still jump up to hit them.  A block is 42px high; Mario's small
   standing height is about 44px.  We leave a comfortable ~18px visual
   clearance between Mario's head and the block bottom.
*/
function fixQuestionBlockClearance(){
  const MARIO_H = 44;
  const CLEARANCE = 18;
  const BLOCK_H = 42;

  for(const b of blocks){
    if(b.used) continue;
    // Find the highest solid top directly below this block.
    let supportTop = VH + 200;
    for(const s of solids){
      const overlap = b.x < s.x+s.w && b.x+b.w > s.x;
      if(overlap && s.y >= b.y + BLOCK_H - 2){
        supportTop = Math.min(supportTop, s.y);
      }
    }

    // Minimum block top that still leaves Mario's full height + clearance.
    const safeY = supportTop - MARIO_H - CLEARANCE - BLOCK_H;
    if(Number.isFinite(safeY)){
      // Never move a block downward; only raise it when it is too low.
      if(b.y > safeY) b.y = Math.max(120, safeY);
    }

    // Keep question blocks away from the very top of the playable area.
    b.y = Math.max(95, b.y);
  }
}

function loadLevel(){
 state="play";cam=0;particles=[];jumpLock=false;boss=null;
 player={x:100,y:380,w:30,h:44,vx:0,vy:0,ground:false,face:1,inv:0,big:false,flower:false,anim:0,shootCooldown:0};
 const z=makeLevel(level);
 solids=z.s;blocks=z.b;items=z.it;enemies=z.en;decor=z.de;pipes=z.pipes;
 updateHUD();$("overlay").style.display="none";
  fixQuestionBlockClearance();
}
function restartLevel(){loadLevel()}
function pause(){
 if(state!=="play")return;

 overlay("PAUSED","Press R to restart this level, or press RESUME.","RESUME");
}

 $("again").style.display=(t==="GAME OVER"||t==="THE END")?"inline-block":"none";
}
function jump(){if(player.ground){player.vy=player.big?-14.2:-12.8;player.ground=false}}
function hurt(){
 if(player.inv>0)return;
 lives--;updateHUD();
 if(lives<=0){
   state="over";
   overlay("GAME OVER","The adventure has ended. Press PLAY AGAIN or R.");
   return;
 }
 player.x=Math.max(50,player.x-150);player.y=260;player.vy=-8;player.inv=130;
}
function blockHit(b){
 if(b.used)return;
 b.used=true;score+=50;

 if(b.item){
   items.push({x:b.x+25,y:b.y-8,r:13,t:b.item,got:false,vx:.7,vy:-1.4});
   addText(b.x+25,b.y-12,"POWER","#7dff91");
 }else{
   coins++;score+=100;
   addText(b.x+25,b.y-10,"+100","#ffe66b");
 }
 updateHUD();
}


function shootFire(){
 if(!player.flower)return;
 player.shootCooldown=16;

 const dir=player.face||1;
 particles.push({
   x:player.x+(dir>0?player.w+6:-6),
   y:player.y+18,
   t:"playerFire",
   vx:dir*8.5,
   vy:0,
   r:7,
   life:90,
   dead:false
 });
}

function update(){
 if(state!=="play")return;

 if(player.shootCooldown>0)player.shootCooldown--;

 const L=keys.ArrowLeft||keys.KeyA,Rt=keys.ArrowRight||keys.KeyD;
 const J=keys.Space||keys.ArrowUp||keys.KeyW;
 const FIRE=keys.KeyF||keys.KeyX;

 if(J&&!jumpLock)jump();
 if(FIRE&&player.flower&&player.shootCooldown<=0)shootFire();
 jumpLock=!!J;

 const target=(Rt?1:0)-(L?1:0);
 player.vx+=(target*5.4-player.vx)*.18;
 if(!target)player.vx*=.84;
 if(Math.abs(player.vx)>.2)player.face=Math.sign(player.vx);

 player.vy=Math.min(15,player.vy+GRAV);
 const oldX=player.x,oldY=player.y;
 player.x+=player.vx;
 player.x=Math.max(0,Math.min(levelW-player.w,player.x));
 player.y+=player.vy;
 player.ground=false;

 // Horizontal/vertical collision is resolved separately to prevent
 // Mario from getting stuck on the side of a platform.
 const all=solids.concat(
   blocks.filter(b=>!b.used).map(b=>R(b.x,b.y,b.w,b.h)),
   pipes
 );

 // Vertical landing / underside collision.
 for(const q of all){
   const horizontal=player.x+player.w>q.x+2 && player.x<q.x+q.w-2;
   if(!horizontal)continue;

   if(oldY+player.h<=q.y+5 && player.y+player.h>=q.y && player.vy>=0){
     player.y=q.y-player.h;
     player.vy=0;
     player.ground=true;
   }else if(oldY>=q.y+q.h-3 && player.y<=q.y+q.h && player.vy<0){
     player.y=q.y+q.h;
     player.vy=0;
     const bb=blocks.find(z=>z.x===q.x&&z.y===q.y);
     if(bb&&!bb.used)blockHit(bb);
   }
 }

 // Horizontal collision only for solid objects.
 for(const q of all){
   const vertical=player.y+player.h>q.y+3 && player.y<q.y+q.h-3;
   if(!vertical)continue;

   if(oldX+player.w<=q.x && player.x+player.w>q.x){
     player.x=q.x-player.w;player.vx=0;
   }else if(oldX>=q.x+q.w && player.x<q.x+q.w){
     player.x=q.x+q.w;player.vx=0;
   }
 }

 // Items.
 for(const it of items){
   if(it.t==="mushroom"&&!it.got){
     it.x+=it.vx||.7;
     it.y+=it.vy||0;
     it.vy=(it.vy||0)+.08;

     // Mushroom lands on ground/platforms.
     for(const q of solids){
       if(it.x+12>q.x&&it.x-12<q.x+q.w&&it.y+12>=q.y&&it.y<q.y){
         it.y=q.y-12;it.vy=0;
       }
     }
   }

   if(!it.got&&hit(player,R(it.x-12,it.y-12,24,24))){
     it.got=true;
     if(it.t==="mushroom"){
       player.big=true;score+=500;addText(it.x,it.y,"SUPER!","#8dff9d");
     }else if(it.t==="flower"){
       player.big=true;player.flower=true;score+=1000;addText(it.x,it.y,"FIRE POWER!","#ff7b32");
     }else{
       coins++;score+=100;addText(it.x,it.y,"+100","#ffe66b");
     }
     updateHUD();
   }
 }

 // Enemies.
 for(const e of enemies){
   if(e.dead)continue;
   e.x+=e.vx;

   if(e.type==="flyer"){
     e.y=385+Math.sin(performance.now()/500+e.phase)*55;
   }else{
     const floor=solids.find(q=>e.x+e.w>q.x&&e.x<q.x+q.w&&Math.abs(e.y+e.h-q.y)<14);
     if(!floor||e.x<floor.x||e.x+e.w>floor.x+floor.w)e.vx*=-1;
   }

   if(hit(player,e)){
     if(player.vy>1&&player.y+player.h-e.y<18){
       e.dead=true;player.vy=-8;score+=250;addText(e.x,e.y,"+250","#fff");
     }else hurt();
   }
 }


 // Mario fireballs defeat enemies from a distance.
 for(const p of particles){
   if(p.t!=="playerFire"||p.dead)continue;
   p.x+=p.vx;
   p.y+=p.vy;
   p.life--;
   for(const e of enemies){
     if(!e.dead && hit({x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2},e)){
       e.dead=true;
       p.dead=true;
       score+=400;
       addText(e.x,e.y,"+400","#ffb13b");
       break;
     }
   }
   if(level===10 && boss && !boss.dead &&
      hit({x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2},boss)){
     p.dead=true;
     boss.hp=Math.max(0,boss.hp-1);
     score+=750;
     addText(boss.x,boss.y,"FIRE HIT!","#ffb13b");
     if(boss.hp<=0){
       boss.dead=true;score+=20000;state="levelwin";
       overlay("DRAGON DEFEATED","You conquered all 10 worlds! Final score: "+score);
       $("again").style.display="inline-block";
       $("next").style.display="none";
     }
   }
 }
 particles=particles.filter(p=>p.life>0&&!p.dead);


 if(player.inv>0)player.inv--;
 if(player.y>620)hurt();

 // Flag.
 if(level<10&&player.x+player.w>goal.x){
   score+=5000+level*1000;
   state="levelwin";
   overlay(`WORLD ${level} COMPLETE`,`Flag captured! Get ready for World ${level+1}.`);
 }

 if(level===10)updateBoss();

 cam=Math.max(0,Math.min(levelW-VW,player.x-350));

 particles.forEach(p=>{p.y+=p.vy;p.vy-=.02;p.life--});
 particles=particles.filter(p=>p.life>0);
 player.anim++;
 updateHUD();
}

function updateBoss(){
 if(!boss||boss.dead)return;

 boss.x+=boss.vx;
 if(boss.x<levelW-850||boss.x>levelW-160)boss.vx*=-1;

 boss.fire--;
 if(boss.fire<=0){
   boss.fire=85;
   particles.push({
     x:boss.x,y:boss.y+45,t:"fireball",life:120,
     vx:player.x<boss.x?-3.5:3.5,vy:0,r:9
   });
 }

 if(hit(player,boss)){
   if(player.vy>2&&player.y+player.h-boss.y<28){
     boss.hp--;player.vy=-11;score+=1000;
     addText(boss.x,boss.y,"HIT!","#ffdb57");
     updateHUD();

     if(boss.hp<=0){
       boss.dead=true;score+=20000;state="levelwin";
       overlay("DRAGON DEFEATED","You conquered all 10 worlds! Final score: "+score);
       $("again").style.display="inline-block";
       $("next").style.display="none";
     }
   }else hurt();
 }

 for(const p of particles){
   if(p.t==="fireball"&&!p.dead){
     p.x+=p.vx||0;
     if(hit(player,{x:p.x-p.r,y:p.y-p.r,w:p.r*2,h:p.r*2})){
       p.dead=true;hurt();
     }
   }
 }
}

function nextLevel(){

   return;

}

function draw(){
 ctx.clearRect(0,0,VW,VH);

 const sky=ctx.createLinearGradient(0,0,0,VH);
 const schemes=[
  ["#55cfff","#dff8ff"],["#4c9bff","#c7e6ff"],["#344b8f","#9a91cc"],["#1b6b5a","#9ce1b0"],
  ["#1d4d72","#b5d6e8"],["#7b4b25","#f2b76a"],["#382c56","#a982c7"],["#172331","#71849b"],
  ["#5b2830","#eaa16d"],["#120f1f","#442a51"]
 ];
 const sc=schemes[level-1];
 sky.addColorStop(0,sc[0]);sky.addColorStop(1,sc[1]);
 ctx.fillStyle=sky;ctx.fillRect(0,0,VW,VH);

 ctx.save();ctx.translate(-cam,0);
 drawBackground();
 for(const d of decor)drawDecor(d);
 for(const p of solids)drawGround(p);
 for(const p of pipes)drawPipe(p);
 for(const b of blocks)drawBlock(b);
 for(const it of items)if(!it.got){
   if(it.t==="coin")drawCoin(it.x,it.y+Math.sin(performance.now()/150)*3);
   else if(it.t==="flower")drawFlower(it);
   else drawMushroom(it);
 }
 for(const e of enemies)if(!e.dead)drawEnemy(e);
 if(level<10)drawFlag();else drawCastleGate();
 if(level===10&&!boss.dead)drawBoss();
 drawPlayer(player);

 ctx.font="900 16px Arial";ctx.textAlign="center";
 for(const p of particles){
   if(p.t==="fireball"){drawFire(p);continue}
   if(p.t==="playerFire"){drawPlayerFire(p);continue}
   ctx.globalAlpha=p.life/55;ctx.fillStyle=p.color;ctx.strokeStyle="#000";ctx.lineWidth=3;
   ctx.strokeText(p.t,p.x,p.y);ctx.fillText(p.t,p.x,p.y);
 }
 ctx.globalAlpha=1;ctx.restore();
}

function drawBackground(){
 ctx.globalAlpha=.18;
 for(let i=-1;i<12;i++){
   const bx=i*760;
   ctx.fillStyle=level>=8?"#0a0e18":"#1b5965";
   ctx.beginPath();ctx.moveTo(bx,485);ctx.lineTo(bx+190,300-(i%3)*20);ctx.lineTo(bx+390,485);ctx.closePath();ctx.fill();
 }
 ctx.globalAlpha=1;

 ctx.fillStyle=level>=8?"#f5c5c5":"#fff0a1";
 ctx.beginPath();ctx.arc(cam+800,90,45,0,Math.PI*2);ctx.fill();

 for(let i=0;i<12;i++){
   const px=i*620+90,py=75+(i%4)*35,s=.8+(i%3)*.2;
   ctx.fillStyle="#ffffffcc";
   ctx.beginPath();
   ctx.arc(px,py,23*s,Math.PI,0);
   ctx.arc(px+28*s,py-12*s,29*s,Math.PI,0);
   ctx.arc(px+62*s,py,22*s,Math.PI,0);
   ctx.fillRect(px-3*s,py,68*s,20*s);ctx.fill();
 }
 if(level>=6){ctx.fillStyle="#00000018";ctx.fillRect(cam,0,VW,VH)}
}

function drawDecor(d){
 const s=d.s,x=d.x,y=d.y;
 if(d.type==="tree"){
   ctx.fillStyle="#442c22";ctx.fillRect(x-6*s,y-5*s,12*s,55*s);
   ctx.fillStyle=level>=8?"#432b3d":"#166d42";
   [[0,-27,27],[-19,-12,18],[19,-12,18]].forEach(a=>{
     ctx.beginPath();ctx.arc(x+a[0]*s,y+a[1]*s,a[2]*s,0,7);ctx.fill()
   });
 }else if(d.type==="bush"){
   ctx.fillStyle="#0d5b38";ctx.beginPath();
   ctx.arc(x-18*s,y,17*s,Math.PI,0);
   ctx.arc(x,y-9*s,23*s,Math.PI,0);
   ctx.arc(x+19*s,y,17*s,Math.PI,0);ctx.fill();
 }else if(d.type==="rock"){
   ctx.fillStyle="#697783";ctx.beginPath();
   ctx.moveTo(x-24*s,y+6);ctx.lineTo(x-13*s,y-14*s);ctx.lineTo(x+8*s,y-18*s);
   ctx.lineTo(x+24*s,y+6);ctx.closePath();ctx.fill();
   ctx.fillStyle="#aab7bd";ctx.fillRect(x-8*s,y-11*s,12*s,5*s);
 }else{
   ctx.fillStyle="#d5b15a";ctx.fillRect(x-3,y-42,6,47);
   ctx.fillStyle="#fff1a8";ctx.beginPath();ctx.arc(x,y-48,10,0,7);ctx.fill();
 }
}

function drawBoss(){

 ctx.fillStyle="#68263d";ctx.beginPath();
 ctx.moveTo(20,45);ctx.lineTo(-55,5);ctx.lineTo(-30,75);ctx.lineTo(25,65);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(110,45);ctx.lineTo(185,5);ctx.lineTo(160,75);ctx.lineTo(105,65);ctx.closePath();ctx.fill();
 ctx.fillStyle="#9e352c";ctx.beginPath();ctx.ellipse(65,65,65,55,0,0,7);ctx.fill();
 ctx.fillStyle="#d45a32";ctx.beginPath();ctx.arc(70,28,48,0,7);ctx.fill();
 ctx.fillStyle="#f3d37a";ctx.beginPath();
 ctx.moveTo(38,4);ctx.lineTo(20,-32);ctx.lineTo(53,-5);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(99,4);ctx.lineTo(120,-32);ctx.lineTo(111,14);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff";ctx.fillRect(45,18,15,16);ctx.fillRect(78,18,15,16);
 ctx.fillStyle="#111";ctx.fillRect(53,23,6,8);ctx.fillRect(78,23,6,8);
 ctx.fillStyle="#f3d37a";ctx.fillRect(40,85,50,12);ctx.restore();
}

function drawPlayerFire(p){
 ctx.fillStyle="#ff5b24";
 ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ffe08a";
 ctx.beginPath();ctx.arc(p.x-2,p.y-2,3,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#fff1a8";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.stroke();
}

function drawFire(p){
 ctx.fillStyle="#ff7a18";ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.fill();
 ctx.fillStyle="#fff1a0";ctx.beginPath();ctx.arc(p.x-2,p.y-2,4,0,7);ctx.fill();
}

function drawPlayer(p){
 if(p.inv&&Math.floor(p.inv/5)%2===0)return;
 const a=p.x,b=p.y;
 ctx.save();ctx.translate(a,b);
 ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(15,46,19,4,0,0,7);ctx.fill();
 ctx.fillStyle="#2450ad";ctx.fillRect(5,27,9,14);ctx.fillRect(17,27,9,14);
 ctx.fillStyle="#5b2a1c";ctx.fillRect(2,39,13,6);ctx.fillRect(18,39,13,6);
 ctx.fillStyle="#e5393f";ctx.fillRect(5,14,22,18);
 ctx.fillStyle="#f2a16f";ctx.fillRect(1,18,6,13);ctx.fillRect(25,18,6,13);ctx.fillRect(7,5,19,17);
 ctx.fillStyle="#4c261b";ctx.fillRect(7,4,19,7);
 ctx.fillStyle="#e5393f";ctx.fillRect(4,1,23,8);ctx.fillRect(0,6,29,6);
 ctx.fillStyle="#fff";ctx.font="bold 7px Arial";ctx.textAlign="center";ctx.fillText("A",16,8);
 if(p.big){ctx.fillStyle="#fff3d0";ctx.fillRect(5,13,22,3)}
 if(p.flower){ctx.fillStyle="#ff6a32";ctx.fillRect(4,2,23,4);ctx.fillStyle="#ffd447";ctx.fillRect(9,0,6,3);ctx.fillRect(18,0,6,3)}
 ctx.fillStyle="#222";ctx.fillRect(20,12,3,3);
 ctx.fillStyle="#ffd33b";ctx.fillRect(11,18,3,3);ctx.fillRect(18,18,3,3);
 ctx.restore();
}

function loop(){update();draw();requestAnimationFrame(loop)}
loadLevel();requestAnimationFrame(loop);

const fullscreenBtn = document.getElementById('fullscreenBtn');
if(fullscreenBtn){
  fullscreenBtn.addEventListener('click', async ()=>{
    try{
      if(!document.fullscreenElement){
        await document.documentElement.requestFullscreen?.();
      }else{
        await document.exitFullscreen?.();
      }
    }catch(e){}
    fitGameToScreen();
  });
}
fitGameToScreen();

</script>
