<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Style — HTML Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif
        }

        body {
            touch-action: none;
            user-select: none
        }

        #game {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges
        }

        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 14px 22px;
            color: #fff;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            pointer-events: none;
            font-size: 20px
        }

        .hudBox {
            min-width: 120px
        }

        .hudBox span {
            display: block;
            font-size: 12px;
            color: #ffe27a;
            letter-spacing: 1px
        }

        #message {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: #fff;
            display: none;
            background: rgba(0, 0, 0, .78);
            border: 4px solid #fff;
            border-radius: 16px;
            padding: 28px 35px;
            box-shadow: 0 12px 0 rgba(0, 0, 0, .25)
        }

        #message h1 {
            font-size: 38px;
            margin-bottom: 10px
        }

        #message p {
            font-size: 18px;
            line-height: 1.6
        }

        button {
            border: 0;
            border-radius: 12px;
            padding: 12px 22px;
            margin-top: 16px;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            background: #ffd83d;
            color: #222;
            box-shadow: 0 5px 0 #a97900
        }

        #touch {
            position: fixed;
            bottom: 18px;
            left: 0;
            width: 100%;
            z-index: 7;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none
        }

        .pad {
            display: flex;
            gap: 12px;
            pointer-events: auto
        }

        .touchBtn {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, .65);
            background: rgba(0, 0, 0, .35);
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            display: grid;
            place-items: center;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .3);
            -webkit-tap-highlight-color: transparent
        }

        .touchBtn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, .3)
        }

        @media(max-width:650px) {
            #hud {
                padding: 8px 10px;
                font-size: 15px
            }

            .hudBox {
                min-width: 90px
            }

            .touchBtn {
                width: 58px;
                height: 58px;
                font-size: 24px
            }

            #message h1 {
                font-size: 28px
            }

            #message {
                width: 90%;
                padding: 22px
            }
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>

    <div id="hud">
        <div class="hudBox"><span>PLAYER</span>🍄 MARIO</div>
        <div class="hudBox"><span>COINS</span>🪙 <b id="coins">0</b></div>
        <div class="hudBox"><span>WORLD</span>1-1</div>
        <div class="hudBox"><span>SCORE</span><b id="score">0</b></div>
    </div>

    <div id="message">
        <h1 id="messageTitle">GAME OVER</h1>
        <p id="messageText">Press R or the button to restart.</p>
        <button id="restart">RESTART</button>
    </div>

    <div id="touch">
        <div class="pad">
            <div class="touchBtn" data-key="ArrowLeft">◀</div>
            <div class="touchBtn" data-key="ArrowRight">▶</div>
        </div>
        <div class="pad">
            <div class="touchBtn" data-key="Space">●</div>
        </div>
    </div>

    <script>
        "use strict";

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        const W = 960, H = 540;
        let scale = 1, offsetX = 0, offsetY = 0;

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = innerWidth * dpr;
            canvas.height = innerHeight * dpr;
            canvas.style.width = innerWidth + "px";
            canvas.style.height = innerHeight + "px";
            scale = Math.min(innerWidth / W, innerHeight / H);
            offsetX = (innerWidth - W * scale) / 2;
            offsetY = (innerHeight - H * scale) / 2;
            ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offsetX, dpr * offsetY);
        }
        addEventListener("resize", resize);
        resize();

        const keys = {};
        addEventListener("keydown", e => {
            keys[e.code] = true;
            if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) e.preventDefault();
            if (e.code === "KeyR" && gameOver) reset();
        });
        addEventListener("keyup", e => keys[e.code] = false);

        document.querySelectorAll(".touchBtn").forEach(btn => {
            const k = btn.dataset.key;
            const down = e => { e.preventDefault(); keys[k] = true };
            const up = e => { e.preventDefault(); keys[k] = false };
            btn.addEventListener("pointerdown", down);
            btn.addEventListener("pointerup", up);
            btn.addEventListener("pointercancel", up);
            btn.addEventListener("pointerleave", up);
        });

        document.getElementById("restart").onclick = reset;

        const gravity = .62;
        const worldWidth = 6200;

        let player, platforms, enemies, coins, blocks, flag, cameraX;
        let score = 0, coinCount = 0, gameOver = false, won = false;
        let particles = [], clouds = [], hills = [];

        function rect(x, y, w, h) { return { x, y, w, h } }

        function reset() {
            score = 0; coinCount = 0; gameOver = false; won = false; cameraX = 0;
            particles = [];

            player = {
                x: 100, y: 350, w: 30, h: 42, vx: 0, vy: 0,
                speed: 4.7, jump: 12.8, onGround: false,
                facing: 1, inv: 0, anim: 0
            };

            platforms = [
                rect(0, 480, 1100, 60), rect(1220, 480, 900, 60),
                rect(2320, 480, 1200, 60), rect(3620, 480, 1050, 60),
                rect(4770, 480, 1430, 60),

                rect(430, 390, 150, 22), rect(700, 330, 150, 22),
                rect(1010, 410, 110, 22), rect(1270, 370, 160, 22),
                rect(1540, 315, 130, 22), rect(1780, 390, 150, 22),
                rect(2070, 330, 100, 22), rect(2440, 380, 160, 22),
                rect(2700, 320, 140, 22), rect(2940, 390, 180, 22),
                rect(3260, 335, 120, 22), rect(3710, 380, 160, 22),
                rect(3990, 315, 140, 22), rect(4280, 370, 150, 22),
                rect(4520, 300, 120, 22), rect(4900, 385, 160, 22),
                rect(5200, 325, 140, 22), rect(5500, 385, 160, 22)
            ];

            blocks = [
                { x: 610, y: 390, type: "question", hit: false },
                { x: 650, y: 390, type: "brick" },
                { x: 690, y: 390, type: "question", hit: false },
                { x: 1300, y: 300, type: "question", hit: false },
                { x: 1350, y: 300, type: "brick" },
                { x: 1400, y: 300, type: "question", hit: false },
                { x: 1800, y: 320, type: "question", hit: false },
                { x: 1850, y: 320, type: "brick" },
                { x: 2500, y: 310, type: "question", hit: false },
                { x: 2550, y: 310, type: "question", hit: false },
                { x: 2600, y: 310, type: "brick" },
                { x: 3100, y: 320, type: "question", hit: false },
                { x: 4050, y: 260, type: "question", hit: false },
                { x: 4100, y: 260, type: "brick" },
                { x: 5050, y: 335, type: "question", hit: false },
                { x: 5100, y: 335, type: "question", hit: false }
            ];

            coins = [
                [465, 350], [735, 290], [1050, 370], [1315, 330], [1365, 330], [1415, 330],
                [1580, 275], [1825, 350], [2110, 290], [2480, 340], [2540, 270], [2735, 280],
                [3010, 350], [3300, 295], [3750, 340], [4025, 275], [4315, 330], [4550, 260],
                [4950, 345], [5250, 285], [5550, 345]
            ].map((p, i) => ({ x: p[0], y: p[1], r: 10, collected: false, bob: i % 3 }));

            enemies = [
                { x: 850, y: 442, w: 30, h: 30, vx: -1.1, dead: false },
                { x: 1450, y: 442, w: 30, h: 30, vx: -1.2, dead: false },
                { x: 1940, y: 442, w: 30, h: 30, vx: -1.1, dead: false },
                { x: 2800, y: 442, w: 30, h: 30, vx: -1.3, dead: false },
                { x: 3450, y: 442, w: 30, h: 30, vx: -1.2, dead: false },
                { x: 4200, y: 442, w: 30, h: 30, vx: -1.4, dead: false },
                { x: 5350, y: 442, w: 30, h: 30, vx: -1.2, dead: false }
            ];

            flag = { x: 6000, y: 180, w: 22, h: 300 };

            clouds = [
                [150, 90, 1.0], [520, 135, .8], [900, 80, 1.15], [1450, 100, .9],
                [1950, 75, 1.1], [2500, 120, .85], [3200, 80, 1.2], [3900, 110, .9],
                [4650, 75, 1.1], [5350, 120, .85]
            ];
            hills = [
                [0, 430, 260, 190], [420, 440, 300, 180], [900, 430, 320, 200],
                [1500, 435, 330, 190], [2150, 430, 350, 200], [2900, 435, 330, 190],
                [3600, 430, 350, 200], [4300, 435, 330, 190], [5000, 430, 360, 200]
            ];
            updateHud();
        }

        function updateHud() {
            document.getElementById("score").textContent = score;
            document.getElementById("coins").textContent = coinCount;
        }

        function overlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function spawn(x, y, text) {
            particles.push({ x, y, text, life: 45, vy: -1.2 });
        }

        function jump() {
            if (player.onGround) {
                player.vy = -player.jump;
                player.onGround = false;
                spawn(player.x + 10, player.y + player.h, "");
            }
        }

        function update(dt) {
            if (gameOver || won) return;

            const left = keys.ArrowLeft || keys.KeyA;
            const right = keys.ArrowRight || keys.KeyD;
            const jumpKey = keys.Space || keys.ArrowUp || keys.KeyW;

            if (jumpKey && !update.lastJump) jump();
            update.lastJump = !!jumpKey;

            let target = 0;
            if (left) target -= player.speed;
            if (right) target += player.speed;

            player.vx += (target - player.vx) * .18;
            if (!left && !right) player.vx *= .82;
            if (Math.abs(player.vx) > .2) player.facing = Math.sign(player.vx);

            player.vy += gravity;
            if (player.vy > 15) player.vy = 15;

            let oldY = player.y;
            player.x += player.vx;
            player.x = Math.max(0, Math.min(worldWidth - player.w, player.x));
            player.y += player.vy;
            player.onGround = false;

            // Platforms
            const solids = platforms.concat(blocks.map(b => rect(b.x, b.y, 50, 22)));
            for (const p of solids) {
                if (overlap(player, p)) {
                    if (oldY + player.h <= p.y + 8 && player.vy >= 0) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    } else if (oldY >= p.y + p.h - 8 && player.vy < 0) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                        const b = blocks.find(b => b.x === p.x && b.y === p.y);
                        if (b && b.type === "question" && !b.hit) {
                            b.hit = true;
                            coinCount++; score += 100;
                            spawn(b.x + 25, b.y - 8, "+100");
                            updateHud();
                        }
                    } else if (player.x + player.w / 2 < p.x + p.w / 2) {
                        player.x = p.x - player.w;
                        player.vx = 0;
                    } else {
                        player.x = p.x + p.w;
                        player.vx = 0;
                    }
                }
            }

            // Coins
            for (const c of coins) {
                if (!c.collected) {
                    const cy = c.y + Math.sin((performance.now() / 140) + c.bob) * 3;
                    if (overlap(player, rect(c.x - 10, cy - 10, 20, 20))) {
                        c.collected = true; coinCount++; score += 200;
                        spawn(c.x, cy - 12, "+200"); updateHud();
                    }
                }
            }

            // Enemies
            for (const e of enemies) {
                if (e.dead) continue;
                e.x += e.vx;
                // reverse at platform edges
                const ground = platforms.find(p => e.x + e.w > p.x && e.x < p.x + p.w && Math.abs((e.y + e.h) - p.y) < 8);
                if (!ground || e.x < ground.x || e.x + e.w > ground.x + ground.w) e.vx *= -1;

                if (overlap(player, e)) {
                    if (player.vy > 1 && player.y + player.h - e.y < 18) {
                        e.dead = true; player.vy = -8; score += 500;
                        spawn(e.x, e.y, "+500"); updateHud();
                    } else if (player.inv <= 0) {
                        player.inv = 100;
                        player.vy = -7;
                        player.vx = -Math.sign(player.x - e.x || 1) * 5;
                        score = Math.max(0, score - 100);
                        updateHud();
                    }
                }
            }

            if (player.inv > 0) player.inv--;

            if (player.y > H + 120) {
                gameOver = true;
                showMessage("GAME OVER", "You fell! Press R or restart.");
            }

            if (player.x + player.w >= flag.x - 10) {
                won = true; score += 5000; updateHud();
                showMessage("YOU WIN!", "World 1-1 complete! Final score: " + score);
            }

            cameraX = player.x - W * .38;
            cameraX = Math.max(0, Math.min(worldWidth - W, cameraX));

            for (const p of particles) {
                p.y += p.vy; p.life--; p.vy -= .02;
            }
            particles = particles.filter(p => p.life > 0);

            player.anim++;
        }

        function showMessage(title, text) {
            document.getElementById("messageTitle").textContent = title;
            document.getElementById("messageText").textContent = text;
            document.getElementById("message").style.display = "block";
        }
        function hideMessage() { document.getElementById("message").style.display = "none" }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // Sky gradient
            const sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, "#58c9ff");
            sky.addColorStop(.65, "#a8e7ff");
            sky.addColorStop(1, "#e9f8ff");
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.translate(-cameraX, 0);

            // Sun
            ctx.fillStyle = "#fff3a0"; ctx.beginPath(); ctx.arc(cameraX + 760, 95, 48, 0, Math.PI * 2); ctx.fill();

            // Clouds
            for (const c of clouds) {
                let x = c[0], y = c[1], s = c[2];
                ctx.fillStyle = "rgba(255,255,255,.92)";
                ctx.beginPath();
                ctx.arc(x, y, 25 * s, Math.PI, 0);
                ctx.arc(x + 28 * s, y - 13 * s, 30 * s, Math.PI, 0);
                ctx.arc(x + 60 * s, y, 23 * s, Math.PI, 0);
                ctx.fillRect(x - 2 * s, y, x + 60 * s - (x - 2 * s), 25 * s);
                ctx.fill();
            }

            // Hills
            for (const h of hills) {
                ctx.fillStyle = "#68b84d";
                ctx.beginPath(); ctx.moveTo(h[0], 480);
                ctx.quadraticCurveTo(h[0] + h[2] / 2, h[1] - h[3], h[0] + h[2], 480);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#8bd064";
                ctx.beginPath(); ctx.moveTo(h[0] + h[2] * .2, 480);
                ctx.quadraticCurveTo(h[0] + h[2] / 2, h[1] - h[3] * .7, h[0] + h[2] * .8, 480);
                ctx.closePath(); ctx.fill();
            }

            // Ground
            for (const p of platforms) {
                drawGround(p);
            }

            // Blocks
            for (const b of blocks) drawBlock(b);

            // Coins
            for (const c of coins) {
                if (c.collected) continue;
                const y = c.y + Math.sin((performance.now() / 140) + c.bob) * 3;
                drawCoin(c.x, y);
            }

            // Enemies
            for (const e of enemies) if (!e.dead) drawGoomba(e.x, e.y);

            // Flag
            drawFlag();

            // Player
            drawMario(player);

            // particles
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            for (const p of particles) {
                ctx.globalAlpha = Math.max(0, p.life / 45);
                ctx.fillStyle = "#fff";
                ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
                ctx.strokeText(p.text, p.x, p.y);
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        function drawGround(p) {
            ctx.fillStyle = "#8b4d28"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#39a83a"; ctx.fillRect(p.x, p.y, p.w, 12);
            ctx.fillStyle = "#62c746"; ctx.fillRect(p.x, p.y, p.w, 5);
            for (let x = p.x; x < p.x + p.w; x += 32) {
                ctx.fillStyle = "#70401f";
                ctx.fillRect(x + 3, p.y + 22, 22, 5);
                ctx.fillRect(x + 16, p.y + 35, 11, 5);
            }
        }

        function drawBlock(b) {
            ctx.fillStyle = b.hit ? "#9a6a35" : (b.type === "brick" ? "#b85b25" : "#f5b82e");
            ctx.fillRect(b.x, b.y, 50, 22);
            ctx.strokeStyle = "#6d3519"; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, 50, 22);
            if (b.type === "question" && !b.hit) {
                ctx.fillStyle = "#fff1a3"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
                ctx.fillText("?", b.x + 25, b.y + 18);
            } else {
                ctx.strokeStyle = "#7d351b"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(b.x + 16, b.y); ctx.lineTo(b.x + 16, b.y + 22);
                ctx.moveTo(b.x + 34, b.y); ctx.lineTo(b.x + 34, b.y + 22); ctx.stroke();
            }
        }

        function drawCoin(x, y) {
            ctx.fillStyle = "#f4a900"; ctx.beginPath(); ctx.ellipse(x, y, 10, 13, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "#9b6500"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "#ffe873"; ctx.beginPath(); ctx.ellipse(x - 2, y, 4, 9, 0, 0, Math.PI * 2); ctx.fill();
        }

        function drawGoomba(x, y) {
            // shadow
            ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(x + 15, y + 30, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
            // body
            ctx.fillStyle = "#a64b20"; ctx.beginPath();
            ctx.arc(x + 15, y + 15, 15, Math.PI, 0); ctx.lineTo(x + 30, y + 25);
            ctx.quadraticCurveTo(x + 15, y + 36, x, y + 25); ctx.closePath(); ctx.fill();
            // eyes
            ctx.fillStyle = "#fff"; ctx.fillRect(x + 6, y + 11, 7, 9); ctx.fillRect(x + 18, y + 11, 7, 9);
            ctx.fillStyle = "#111"; ctx.fillRect(x + 10, y + 14, 3, 6); ctx.fillRect(x + 18, y + 14, 3, 6);
            // feet
            ctx.fillStyle = "#5d2c1c"; ctx.fillRect(x + 1, y + 26, 12, 6); ctx.fillRect(x + 17, y + 26, 12, 6);
        }

        function drawMario(p) {
            if (p.inv > 0 && Math.floor(p.inv / 5) % 2 === 0) return;
            const x = p.x, y = p.y;
            // shadow
            ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x + 15, y + 42, 17, 4, 0, 0, Math.PI * 2); ctx.fill();
            // legs
            ctx.fillStyle = "#203a9a"; ctx.fillRect(x + 6, y + 27, 8, 12); ctx.fillRect(x + 17, y + 27, 8, 12);
            // shoes
            ctx.fillStyle = "#5b2b1d"; ctx.fillRect(x + 3, y + 37, 12, 5); ctx.fillRect(x + 18, y + 37, 12, 5);
            // body
            ctx.fillStyle = "#e53935"; ctx.fillRect(x + 5, y + 15, 21, 17);
            // arms
            ctx.fillStyle = "#f3a06b"; ctx.fillRect(x + 1, y + 18, 6, 13); ctx.fillRect(x + 24, y + 18, 6, 13);
            // face
            ctx.fillStyle = "#f3a06b"; ctx.fillRect(x + 7, y + 6, 18, 14);
            // hair
            ctx.fillStyle = "#4b2518"; ctx.fillRect(x + 7, y + 5, 18, 6);
            // hat
            ctx.fillStyle = "#e53935"; ctx.fillRect(x + 4, y + 1, 22, 7); ctx.fillRect(x + 1, y + 5, 28, 5);
            // M
            ctx.fillStyle = "#fff"; ctx.font = "bold 7px Arial"; ctx.textAlign = "center"; ctx.fillText("M", x + 16, y + 8);
            // eye
            ctx.fillStyle = "#222"; ctx.fillRect(x + 20, y + 11, 3, 3);
            // buttons
            ctx.fillStyle = "#ffd33d"; ctx.fillRect(x + 11, y + 17, 3, 3); ctx.fillRect(x + 18, y + 17, 3, 3);
        }

        function drawFlag() {
            const x = flag.x;
            ctx.fillStyle = "#ddd"; ctx.fillRect(x, flag.y, 5, 300);
            ctx.fillStyle = "#e33"; ctx.beginPath();
            ctx.moveTo(x + 5, flag.y + 12); ctx.lineTo(x + 60, flag.y + 32); ctx.lineTo(x + 5, flag.y + 52); ctx.closePath(); ctx.fill();
            ctx.fillStyle = "#ffd83d"; ctx.beginPath(); ctx.arc(x + 2, flag.y, 9, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#5d9c34"; ctx.fillRect(x - 25, 480, 55, 8);
        }

        // Game loop
        let last = performance.now();
        function loop(now) {
            const dt = Math.min(32, now - last); last = now;
            update(dt / 16.67);
            draw();
            requestAnimationFrame(loop);
        }
        reset();
        hideMessage();
        requestAnimationFrame(loop);
    </script>
</body>

</html>
